[theme]
base = "dark"
primaryColor = "#34D399"
backgroundColor = "#0B1220"
secondaryBackgroundColor = "#131C2E"
textColor = "#E6EDF3"
font = "sans serif"

[server]
# Max size of each uploaded file in MB (Community Cloud has ~1 GB RAM in total).
maxUploadSize = 200

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
